name: Build BAITK Chatwoot Image

on:
  workflow_dispatch:
  push:
    branches: ["main"]

env:
  IMAGE_NAME: ghcr.io/mo-zakii/chatwoot:baitk-4.8.0

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push BAITK image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.baitk
          push: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
